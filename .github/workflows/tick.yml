name: tick
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tick.mjs
        env:
          FGA_KEY: ${{ secrets.FGA_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - name: Redeploy site
        if: hashFiles('.deploy-pages') != ''
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
